<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="t d">
  <title id="t">Savitch's midpoint recursion</title>
  <desc id="d">A path from u to v of at most t steps is split at an intermediate node m into two halves of at most floor(t/2) and ceil(t/2) steps; each half is split again, giving recursion depth log t.</desc>
  <rect width="720" height="360" fill="#F7F7F5"/>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#202124">
    <text x="360" y="34" font-size="18" font-weight="600" text-anchor="middle">reach(u, v, t): guess a midpoint m, then check both halves</text>
    <g stroke="#5F666A" stroke-width="2" fill="none">
      <line x1="90" y1="100" x2="630" y2="100"/>
      <line x1="90" y1="200" x2="360" y2="200"/>
      <line x1="360" y1="200" x2="630" y2="200"/>
      <line x1="90" y1="290" x2="225" y2="290"/>
      <line x1="225" y1="290" x2="360" y2="290"/>
      <line x1="360" y1="290" x2="495" y2="290"/>
      <line x1="495" y1="290" x2="630" y2="290"/>
    </g>
    <g stroke="#315F9C" stroke-width="1.5" stroke-dasharray="4 4">
      <line x1="360" y1="100" x2="360" y2="290"/>
      <line x1="225" y1="200" x2="225" y2="290"/>
      <line x1="495" y1="200" x2="495" y2="290"/>
    </g>
    <g fill="#FFFFFF" stroke="#202124" stroke-width="2">
      <circle cx="90" cy="100" r="16"/><circle cx="630" cy="100" r="16"/>
      <circle cx="90" cy="200" r="16"/><circle cx="360" cy="200" r="16" stroke="#315F9C"/><circle cx="630" cy="200" r="16"/>
      <circle cx="90" cy="290" r="14"/><circle cx="225" cy="290" r="14" stroke="#315F9C"/><circle cx="360" cy="290" r="14" stroke="#315F9C"/><circle cx="495" cy="290" r="14" stroke="#315F9C"/><circle cx="630" cy="290" r="14"/>
    </g>
    <g font-size="15" text-anchor="middle" font-weight="600">
      <text x="90" y="105">u</text><text x="630" y="105">v</text>
      <text x="90" y="205">u</text><text x="360" y="205" fill="#315F9C">m</text><text x="630" y="205">v</text>
    </g>
    <g font-size="14" text-anchor="middle" fill="#5F666A">
      <text x="360" y="88">at most t steps</text>
      <text x="225" y="188">≤ ⌊t/2⌋ steps</text>
      <text x="495" y="188">≤ ⌈t/2⌉ steps</text>
      <text x="360" y="325">each level halves t, so recursion depth is ⌈log₂ t⌉;</text>
      <text x="360" y="345">only one frame per level is live, giving O(log² n) space for t ≤ n</text>
    </g>
    <g font-size="13" fill="#5F666A">
      <text x="660" y="104">level 0</text><text x="660" y="204">level 1</text><text x="660" y="294">level 2</text>
    </g>
  </g>
</svg>
